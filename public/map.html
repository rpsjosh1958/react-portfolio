<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UG Sports Stadium · 3D Site Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dde4e6;font-family:'Instrument Sans',system-ui,sans-serif;color:#1d2226}
  a{color:#1d2226}a:hover{color:#2d5db0}
  #scene{position:fixed;inset:0}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
  .lbl button{pointer-events:auto;cursor:pointer;border:0;background:#fff;color:#1d2226;font:500 12px/1 'Instrument Sans',sans-serif;padding:7px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.16),0 6px 16px rgba(0,0,0,.10);transition:background .15s,color .15s}
  .lbl button:hover{background:#1d2226;color:#fff}
  .lbl i{width:1.5px;height:16px;background:rgba(255,255,255,.95)}
  .lbl b{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #1d2226;margin-top:-1px}
  .lbl.sm button{font-size:11px;padding:5px 9px;background:rgba(255,255,255,.88)}
  header{position:fixed;left:20px;top:18px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  header p{margin:0;font-size:12px;color:#4a5157}
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:#fff;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10)}
  #bar button{border:0;background:transparent;font:500 12px/1 'Instrument Sans',sans-serif;color:#1d2226;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  #bar button:hover{background:#eef0f1}
  #bar button.on{background:#1d2226;color:#fff}
  #bar span{width:1px;background:#e2e5e7;margin:6px 2px}
  #hint{position:fixed;right:20px;top:22px;font-size:11px;color:#4a5157;pointer-events:none}
  #pen{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);display:none;align-items:center;gap:4px;padding:5px 6px;background:#fff;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.10)}
  #pen.open{display:flex}
  #pen .sw{width:22px;height:22px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);margin:0 2px}
  #pen .sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #1d2226}
  #pen .sz{border:0;background:transparent;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  #pen .sz i{display:block;border-radius:50%;background:#1d2226}
  #pen .sz.on{background:#eef0f1}
  #pen .tx{border:0;background:transparent;font:500 12px/1 'Instrument Sans',sans-serif;color:#1d2226;padding:9px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
  #pen .tx:hover{background:#eef0f1}
  #pen span{width:1px;align-self:stretch;background:#e2e5e7;margin:6px 3px}
  body.drawing #scene{cursor:crosshair}
  @media (max-width:760px){#hint{display:none}#bar button{padding:8px 9px}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"
  }
}
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<header>
  <h1>University of Ghana Sports Stadium</h1>
  <p>Legon, Accra · 3D site model</p>
</header>
<div id="bar">
  <button data-view="overview" class="on">Overview</button>
  <button data-view="stadium">Stadium</button>
  <button data-view="top">Top</button>
  <span></span>
  <button id="tLabels" class="on">Labels</button>
  <button id="tRotate">Rotate</button>
  <span></span>
  <button id="tDraw">Draw</button>
</div>
<div id="pen">
  <button class="sw on" data-c="#e0362c" style="background:#e0362c" title="Red"></button>
  <button class="sw" data-c="#f2c230" style="background:#f2c230" title="Yellow"></button>
  <button class="sw" data-c="#1f6fe0" style="background:#1f6fe0" title="Blue"></button>
  <button class="sw" data-c="#ffffff" style="background:#ffffff" title="White"></button>
  <button class="sw" data-c="#1d2226" style="background:#1d2226" title="Black"></button>
  <span></span>
  <button class="sz" data-s="0.5" title="Fine"><i style="width:4px;height:4px"></i></button>
  <button class="sz on" data-s="1.1" title="Medium"><i style="width:8px;height:8px"></i></button>
  <button class="sz" data-s="2.4" title="Thick"><i style="width:13px;height:13px"></i></button>
  <span></span>
  <button class="tx" id="pUndo">Undo</button>
  <button class="tx" id="pClear">Clear all</button>
  <button class="tx" id="pDone">Done</button>
</div>
<div id="hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- setup
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);

const SKY = 0xdde4e6;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 800, 1700);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.4;
controls.minDistance = 50;
controls.maxDistance = 1300;
controls.screenSpacePanning = false;
controls.autoRotateSpeed = 0.6;

scene.add(new THREE.HemisphereLight(0xf6f3ec, 0x7a7158, 1.25));
const sun = new THREE.DirectionalLight(0xfff4e2, 2.3);
sun.position.set(-240, 380, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -460, right: 460, top: 460, bottom: -460, near: 10, far: 1400 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.8;
scene.add(sun);

// ---------- helpers
let seed = 7;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rand() * (b - a);
const M = (name, color, o = {}) => { const m = new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, ...o }); m.name = name; return m; };
const mat = {
  ground: M('ground', 0xa59d6e), earth: M('earth', 0xc8693c), asphalt: M('asphalt', 0x5c5f64),
  concrete: M('concrete', 0xd7d1c3), grass: M('grass', 0x7f9c4e), pitch: M('pitch', 0x5f9b3d),
  pitchLight: M('pitchLight', 0x6daa49), track: M('track', 0x2e5fb4), seat: M('seat', 0xffffff, { vertexColors: true }),
  white: M('white', 0xeeece6), roof: M('roof', 0xf3f2ee, { roughness: 0.6 }), glass: M('glass', 0x36404b, { roughness: 0.3, metalness: 0.2 }),
  seatRed: M('seatRed', 0xd4535f), seatBlue: M('seatBlue', 0x3c60b5), steel: M('steel', 0xbfc3c7, { metalness: 0.5, roughness: 0.45 }),
  terracotta: M('terracotta', 0xc65a31), redroof: M('redroof', 0xb33a32), wall: M('wall', 0xefe8da),
  tree: M('tree', 0xffffff, { flatShading: true }), trunk: M('trunk', 0x6b5238), lamp: M('lamp', 0x3b3f44)
};
const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
const shapeFrom = pts => new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
const rectPts = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
function flat(shape, material, y, parent = scene) {
  const g = new THREE.ShapeGeometry(shape, 48); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, material); m.position.y = y; m.receiveShadow = true; parent.add(m); return m;
}
const rect = (x0, z0, x1, z1, material, y, parent) => flat(shapeFrom(rectPts(x0, z0, x1, z1)), material, y, parent);
function box(w, h, d, material, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
// stadium (running-track) path: u in [0,4): N straight, E curve, S straight, W curve
function pp(u, r, a) {
  u = ((u % 4) + 4) % 4; const k = Math.floor(u), f = u - k;
  if (k === 0) return [-a + 2 * a * f, -r];
  if (k === 1) { const t = -Math.PI / 2 + Math.PI * f; return [a + r * Math.cos(t), r * Math.sin(t)]; }
  if (k === 2) return [a - 2 * a * f, r];
  const t = Math.PI / 2 + Math.PI * f; return [-a + r * Math.cos(t), r * Math.sin(t)];
}
const stadPts = (a, r, n = 160) => Array.from({ length: n }, (_, i) => pp(4 * i / n, r, a));
const stadShape = (a, r, hole) => { const s = shapeFrom(stadPts(a, r)); if (hole) s.holes.push(new THREE.Path(stadPts(a, hole).map(([x, z]) => new THREE.Vector2(x, -z)))); return s; };
const loop = (pts, y, parent, closed = true) => {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(([x, z]) => new THREE.Vector3(x, y, z)));
  parent.add(closed ? new THREE.LineLoop(g, lineMat) : new THREE.Line(g, lineMat));
};
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function band(u0, u1, prof, a, { tile = 0 } = {}) {
  const n = prof.length, cnt = Math.max(2, Math.ceil((u1 - u0) * 40)), pos = [], uv = [], idx = [];
  let dist = 0, prev = null; const rO = prof[n - 1][0];
  for (let i = 0; i <= cnt; i++) {
    const u = u0 + (u1 - u0) * i / cnt, po = pp(u, rO, a);
    if (prev) dist += Math.hypot(po[0] - prev[0], po[1] - prev[1]); prev = po;
    prof.forEach(([r, h], j) => { const [x, z] = pp(u, r, a); pos.push(x, h, z); uv.push(tile ? dist / tile : 0, j / (n - 1)); });
  }
  for (let i = 0; i < cnt; i++) for (let j = 0; j < n - 1; j++) { const A = i * n + j, B = A + 1, C = A + n, D = C + 1; idx.push(A, C, B, B, C, D); }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g = g.toNonIndexed(); g.computeVertexNormals(); return g;
}
function shadeSteps(g, top, side) {
  const n = g.attributes.normal, col = [], ct = new THREE.Color(top), cs = new THREE.Color(side);
  for (let i = 0; i < n.count; i++) { const c = Math.abs(n.getY(i)) > 0.7 ? ct : cs; col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); return g;
}
function cap(u, prof, a, material, parent) {
  const tris = THREE.ShapeUtils.triangulateShape(prof.map(([r, h]) => new THREE.Vector2(r, h)), []), pos = [];
  tris.forEach(t => t.forEach(i => { const [r, h] = prof[i]; const [x, z] = pp(u, r, a); pos.push(x, h, z); }));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, material); m.castShadow = true; parent.add(m);
}
const mesh = (g, m, parent = scene) => { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };
function roadSeg(x0, z0, x1, z1, w, material, y, tileLen) {
  const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz);
  const g = new THREE.PlaneGeometry(L, w); const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setX(i, uv.getX(i) * L / tileLen);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, material); m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); m.rotation.y = Math.atan2(-dz, dx); m.receiveShadow = true; scene.add(m); return m;
}
const DS = THREE.DoubleSide;
[mat.seat, mat.concrete, mat.white].forEach(m => m.side = DS);

// ---------- textures
const facadeTex = canvasTex(1024, 128, (x) => {
  x.fillStyle = '#ebe7de'; x.fillRect(0, 0, 1024, 128);
  const cols = ['#b5472f', '#a0958c', '#ebe7de', '#b5472f', '#827c76', '#c95b3d', '#b5472f'];
  let px = 0; while (px < 1024) { const w = 9 + Math.floor(rand() * 13); x.fillStyle = cols[Math.floor(rand() * cols.length)]; x.fillRect(px, 14, w - 3, 82); px += w; }
  x.fillStyle = '#5a5d62'; x.fillRect(0, 96, 1024, 32);
  x.fillStyle = '#d2cdc3'; for (let i = 20; i < 1024; i += 80) x.fillRect(i, 96, 7, 32);
});
facadeTex.wrapT = THREE.ClampToEdgeWrapping;
const facadeMat = M('facade', 0xffffff, { map: facadeTex, side: DS });

const stallMat = M('parkingBay', 0xffffff, { map: canvasTex(256, 128, (x) => {
  x.fillStyle = '#d9d3c4'; x.fillRect(0, 0, 256, 128);
  x.fillStyle = '#f8f6f0'; x.fillRect(0, 62, 256, 4);
  for (let i = 0; i < 256; i += 64) x.fillRect(i, 8, 3, 112);
  x.fillStyle = '#b9b2a2'; x.fillRect(0, 0, 256, 6); x.fillRect(0, 122, 256, 6);
}) });
const hwMat = M('highway', 0xffffff, { map: canvasTex(128, 384, (x) => {
  x.fillStyle = '#5b5e63'; x.fillRect(0, 0, 128, 384);
  x.fillStyle = '#c9c4b6'; x.fillRect(0, 180, 128, 24);
  x.fillStyle = '#7f9a52'; x.fillRect(0, 186, 128, 12);
  x.fillStyle = '#f2f0ea'; [8, 174, 210, 374].forEach(y => x.fillRect(0, y, 128, 3));
  [50, 92, 134, 250, 292, 334].forEach(y => x.fillRect(0, y, 64, 3));
}) });
const roadMat = M('road', 0xffffff, { map: canvasTex(128, 128, (x) => {
  x.fillStyle = '#5c5f64'; x.fillRect(0, 0, 128, 128);
  x.fillStyle = '#f2f0ea'; x.fillRect(0, 6, 128, 3); x.fillRect(0, 119, 128, 3); x.fillRect(0, 62, 64, 3);
}) });

// ---------- ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), mat.ground);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const EARTH = [[38, 175], [45, 96], [112, 58], [118, -20], [105, -95], [232, -112], [262, -30], [305, 96], [322, 262], [232, 334], [78, 292]];
flat(shapeFrom(EARTH), mat.earth, 0.02);
// south-west dirt paths
roadSeg(-180, 210, -60, 250, 6, mat.earth, 0.025, 10);
roadSeg(-260, 150, -180, 210, 5, mat.earth, 0.025, 10);

// ---------- athletics track + pitch
const A = 42.2;
function buildTrack(parent, apron) {
  flat(stadShape(A, apron), mat.track, 0.12, parent);
  rect(-A, -36.4, A, 36.4, mat.pitch, 0.15, parent);
  rect(-52.5, -34, 52.5, 34, mat.pitch, 0.15, parent);
  for (let i = 0; i < 14; i += 2) rect(-52.5 + i * 7.5, -34, -45 + i * 7.5, 34, mat.pitchLight, 0.17, parent);
  for (let i = 0; i <= 8; i++) loop(stadPts(A, 36.5 + i * 1.22), 0.2, parent);
  const y = 0.21;
  loop(rectPts(-52.5, -34, 52.5, 34), y, parent);
  loop([[0, -34], [0, 34]], y, parent, false);
  loop(Array.from({ length: 48 }, (_, i) => [9.15 * Math.cos(i / 48 * 6.283), 9.15 * Math.sin(i / 48 * 6.283)]), y, parent);
  [-1, 1].forEach(s => {
    loop([[s * 52.5, -20.16], [s * 36, -20.16], [s * 36, 20.16], [s * 52.5, 20.16]], y, parent, false);
    loop([[s * 52.5, -9.16], [s * 47, -9.16], [s * 47, 9.16], [s * 52.5, 9.16]], y, parent, false);
    box(0.15, 0.15, 7.32, mat.white, s * 52.5, 2.44, 0, parent);
    box(0.15, 2.44, 0.15, mat.white, s * 52.5, 1.22, -3.66, parent);
    box(0.15, 2.44, 0.15, mat.white, s * 52.5, 1.22, 3.66, parent);
  });
}

// ---------- main stadium
const S = new THREE.Group(); scene.add(S);
flat(stadShape(A, 94), mat.asphalt, 0.04, S);
flat(stadShape(A, 82), mat.concrete, 0.07, S);
flat(stadShape(A, 57), mat.grass, 0.09, S);
loop(stadPts(A, 93.2), 0.08, S);
// grass-ring footpaths
[0.5, 1.5, 2.5, 3.5, 1.2, 1.8, 3.2, 3.8].forEach(u => {
  const [x0, z0] = pp(u, 50, A), [x1, z1] = pp(u, 56.5, A); roadSeg(x0, z0, x1, z1, 2.2, mat.concrete, 0.1, 10);
});
buildTrack(S, 50);

const R0 = 56, R1 = 73, RF = 75;
function stand(u0, u1, rows, h1, backMat) {
  const prof = [[R0, 0], [R0, 1.3]]; const dr = (R1 - R0) / rows, dh = (h1 - 1.3) / rows;
  for (let k = 0; k < rows; k++) { const r = R0 + (k + 1) * dr, h = 1.3 + k * dh; prof.push([r, h], [r, h + dh]); }
  mesh(shadeSteps(band(u0, u1, prof, A), 0x4c8c64, 0x2f5c45), mat.seat, S);
  mesh(band(u0, u1, [[R1, h1], [RF, h1]], A), mat.concrete, S);
  mesh(band(u0, u1, [[RF, 0], [RF, h1 + 1.2]], A, { tile: backMat === facadeMat ? 40 : 0 }), backMat, S);
  const capProf = [...prof, [RF, h1], [RF, 0]];
  cap(u0, capProf, A, mat.white, S); cap(u1, capProf, A, mat.white, S);
}
stand(0.075, 0.925, 13, 12.5, mat.white);    // north straight — free-standing, gaps either end
stand(0.995, 2.13, 13, 12.5, facadeMat);     // east curve, wraps onto south side
stand(2.87, 4.005, 13, 12.5, facadeMat);     // west curve, wraps onto south side

// main grandstand (south)
{
  const G = new THREE.Group(); S.add(G);
  const rows = 12, z0 = 55, z1 = 69, dz = (z1 - z0) / rows, dh = (12 - 1.4) / rows;
  for (let k = 0; k < rows; k++) {
    const h = 1.4 + k * dh, z = z0 + k * dz + dz / 2;
    box(21, h, dz, mat.seatRed, -19.5, h / 2, z, G); box(18, h, dz, mat.seatBlue, 0, h / 2, z, G); box(21, h, dz, mat.seatRed, 19.5, h / 2, z, G);
  }
  box(62, 20, 12, mat.white, 0, 10, 75, G);
  box(58, 3.2, 0.4, mat.glass, 0, 15.5, 68.9, G);
  box(58, 1.4, 0.4, mat.glass, 0, 19.2, 81.1, G);
  [-1, 1].forEach(s => box(1.2, 22, 30, mat.white, s * 31.4, 11, 66, G));
  const roof = box(68, 0.8, 34, mat.roof, 0, 23.4, 64, G); roof.rotation.x = -0.035;
  box(68, 1.8, 0.6, mat.roof, 0, 23.6, 47.2, G);
  for (let x = -30; x <= 30; x += 10) box(0.5, 3, 0.5, mat.steel, x, 21.5, 80.5, G);
  // rear: curved steel ribs, roof lip, entrances and apron
  const ribMat = M('ribs', 0x8b9096, { roughness: 0.6, metalness: 0.3 });
  for (let x = -32; x <= 32.1; x += 4) {
    const c = new THREE.CubicBezierCurve3(new THREE.Vector3(x, 0, 85), new THREE.Vector3(x, 9, 89.5), new THREE.Vector3(x, 19, 88), new THREE.Vector3(x, 23.6, 81));
    const rib = new THREE.Mesh(new THREE.TubeGeometry(c, 24, 0.55, 6), ribMat); rib.scale.x = 0.6; rib.position.x = x * 0.4; rib.castShadow = true; G.add(rib);

  pen.on = on; tD.classList.toggle('on', on); penBar.classList.toggle('open', on); document.body.classList.toggle('drawing', on);
  controls.mouseButtons = on ? { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE } : defaultButtons;
  controls.touches = on ? { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE } : defaultTouches;
  document.getElementById('hint').textContent = on ? 'Left-drag to draw · Right-drag to orbit · Scroll to zoom' : 'Drag to orbit · Right-drag to pan · Scroll to zoom';
}
tD.onclick = () => setPen(!pen.on);
document.getElementById('pDone').onclick = () => setPen(false);
penBar.querySelectorAll('.sw').forEach(b => b.onclick = () => { pen.color = b.dataset.c; penBar.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); });
penBar.querySelectorAll('.sz').forEach(b => b.onclick = () => { pen.size = +b.dataset.s; penBar.querySelectorAll('.sz').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('pUndo').onclick = () => { const s = strokes.pop(); if (s && s.mesh) { strokesG.remove(s.mesh); s.mesh.geometry.dispose(); } save(); };
document.getElementById('pClear').onclick = () => { strokes.forEach(s => { if (s.mesh) { strokesG.remove(s.mesh); s.mesh.geometry.dispose(); } }); strokes = []; save(); };
addEventListener('keydown', e => { if (pen.on && (e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); document.getElementById('pUndo').click(); } });
renderer.setAnimationLoop(() => {
  if (anim) {
    let k = Math.min(1, (performance.now() - anim.s) / anim.dur); const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e);
    if (k >= 1) anim = null;
  }
  controls.update(); renderer.render(scene, camera); updateLabels();
});
</script>
</body>
